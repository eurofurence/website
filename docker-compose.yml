services:
  www:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html/
    env_file:
      - .env
    networks:
      - default

  scss-watch:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund && npm run scss:watch"
    restart: unless-stopped
    volumes:
      - ./:/workspace
    networks:
      - default