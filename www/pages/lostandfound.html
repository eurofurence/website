
<style>
    .lf-card {
        transition: transform 128ms ease;
    }
    .lf-card:hover {
        transform: translateY(-2px);
    }

    .lf-card-body {
        justify-content: space-between;
        padding-top: 24px;
    }

    .lf-media {
        aspect-ratio: 16 / 10;
        overflow: hidden;
        display: block;
        border-radius: var(--ef-border-radius) var(--ef-border-radius) 0 0;
    }

    .lf-image-link {
        display: block;
        width: 100%;
        height: 100%;
    }

    .lf-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 256ms ease;
    }
    .lf-card:hover .lf-image {
        transform: scale(1.04);
    }

    .lf-item-description {
        margin-bottom: 12px;
        line-clamp: 4;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .lf-card:hover .lf-item-description {
        line-clamp: unset;
        -webkit-line-clamp: unset;
    }

    .lf-item-id {
        margin: 0;
    }

    .lf-meta-list {
        margin: 0;
        font-size: 0.9rem;
    }

    .lf-meta-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding-top: 8px;
        margin-top: 8px;
    }
    .lf-meta-list li:first-of-type {
        border-top: 1px solid #EEEEEE;
    }

    .lf-meta-label {
        font-weight: 500;
    }

    .lf-label {
        border-radius: 999px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        pointer-events: none;
    }
    .lf-label--lost {
        background: #AF1632;
    }
    .lf-label--found {
        background: #13A35B;
    }
    .lf-label--returned {
        background: #1277DB;
    }
    .lf-label--unknown {
        background: #888888;
    }

    .uk-alert-primary {
        color: #FFFFFF;
    }
    .uk-alert-primary:hover {
        background-color: var(--ef-green) !important;
    }

    @media (min-width: 1600px) {
        .lf-toolbar-card {
            padding: 32px;
        }

        .lf-card-body {
            padding: 16px 24px;
        }
    }
</style>

<section>
    <h1>Lost and Found</h1>

    <p>All Items found at the convention are stored and can be redeemed only at the Security FrontDesk at next Eurofurence in Hamburg.</p>

    <div class="uk-card uk-card-default uk-card-body uk-margin-medium-bottom lf-toolbar-card">
        <div class="uk-grid-small uk-flex-middle" uk-grid>
            <div class="uk-width-expand@m">
                <label for="ef-lostandfound-search" class="uk-form-label">Search Items</label>
                <div class="uk-inline uk-width-1-1">
                    <span class="uk-form-icon" uk-icon="icon: search"></span>
                    <input id="ef-lostandfound-search" type="search" class="uk-input" placeholder="Search by title, description, or item ID" />
                </div>
            </div>

            <div class="uk-width-1-3@m uk-width-1-2@s">
                <label for="ef-lostandfound-status" class="uk-form-label">Status</label>
                <select id="ef-lostandfound-status" class="uk-select">
                    <option value="all">All statuses</option>
                    <option value="L">Lost</option>
                    <option value="F">Found</option>
                    <option value="U">Unknown</option>
                </select>
            </div>
        </div>
    </div>

    <div id="ef-lostandfound-state" class="uk-margin-bottom" aria-live="polite"></div>

    <div id="ef-lostandfound" class="uk-grid-small uk-grid-match uk-child-width-1-2@s uk-child-width-1-3@l uk-child-width-1-4@xl uk-margin-bottom" uk-grid></div>
</section>

<script src="js/lostandfound.js"></script>
